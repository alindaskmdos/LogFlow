services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: logflow-clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT}:8123"
      - "${CLICKHOUSE_NATIVE_PORT}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: logflow-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

  seq:
    image: datalust/seq:latest
    container_name: logflow-seq
    ports:
      - "${SEQ_PORT}:80"
      - "${SEQ_INGESTION_PORT}:5341"
    environment:
      - ACCEPT_EULA=y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_ADMIN_PASSWORD}
    volumes:
      - seq_data:/data

  logflow-api:
    build:
      context: ..
      dockerfile: LogFlow.Api/Dockerfile
    container_name: logflow-api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - Serilog__WriteTo__1__Args__serverUrl=http://logflow-seq:80
      - ClickHouse__ConnectionString=Host=logflow-clickhouse;Port=8123;Database=${CLICKHOUSE_DB};Username=${CLICKHOUSE_USER};Password=${CLICKHOUSE_PASSWORD}
      - Redis__ConnectionString=logflow-redis:6379
    depends_on:
      - clickhouse
      - redis
      - seq

volumes:
  clickhouse_data:
  redis_data:
  seq_data: